apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogue
  namespace: {{ .Release.Namespace }}
  labels:
    app: catalogue
    project: roboshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalogue
  template:
    metadata:
      labels:
        app: catalogue
        project: roboshop
    spec:
      containers:
        - name: catalogue
          image: "717090908085.dkr.ecr.us-east-1.amazonaws.com/roboshop/catalogue@{{ required "image.digest is required" .Values.image.digest }}"
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: catalogue-secret
                  key: MONGO_URL

          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 6
            failureThreshold: 3

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi