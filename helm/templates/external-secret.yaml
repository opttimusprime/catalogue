apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: catalogue-external-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: catalogue-secret
    creationPolicy: Owner
  data:
    - secretKey: MONGO_URL
      remoteRef:
        key: roboshop/dev/catalogue
        property: MONGO_URL